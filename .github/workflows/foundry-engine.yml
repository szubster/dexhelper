name: The Foundry Engine

on:
  schedule:
    - cron: '0 * * * *' # Hourly sync
  workflow_dispatch:

concurrency:
  group: foundry-engine

permissions:
  contents: write
  issues: write

jobs:
  orchestrate:
    name: Orchestrate DAG
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Required for --strip-types
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Heartbeat
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --strip-types .github/scripts/foundry-heartbeat.ts

      - name: Verify DAG References
        run: |
          pnpm --filter foundry-scripts verify:refs

      - name: Run Orchestrator
        id: set-matrix
        run: |
          set +e
          output=$(node --strip-types .github/scripts/foundry-orchestrator.ts --strict 2> orchestrator-err.log | tail -n 1)
          exit_code=${PIPESTATUS[0]}
          set -e
          cat "orchestrator-err.log" >&2

          # Check for WARN messages indicating unresolvable/circular dependencies.
          if grep -q "WARN" orchestrator-err.log; then
            echo "dag_has_warnings=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$exit_code" -ne 0 ]; then
            # Fail the build for warnings/orchestrator issues as requested
            sh -c "exit $exit_code" || true
            exit "$exit_code"
          fi
          printf 'matrix=%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Report DAG Warnings
        if: always() && steps.set-matrix.outputs.dag_has_warnings == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MY_ISSUES_PAT }}
        run: |
          ISSUE_TITLE="Foundry Engine: DAG Resolution Warnings - ${{ github.run_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Use EOF heredoc and multiline string injection for GH issue body to avoid format issues
          {
            echo "The Foundry DAG orchestrator encountered warnings during resolution. This usually means there are missing or circular dependencies in the DAG."
            echo ""
            echo "**Run Details:** [View Action Run]($RUN_URL)"
            echo ""
            echo "**Error Log:**"
            echo '```'
            cat "orchestrator-err.log"
            echo '```'
          } > issue_body.md

          # Always create a new issue for each warning occurrence
          gh issue create --title "$ISSUE_TITLE" --body-file issue_body.md --label "jules"

      - name: Commit Promotions
        run: |
          set -o pipefail
          # Check for READY state changes promoted by the orchestrator and ACTIVE_SESSIONS.md updates
          if [[ -n $(git status --porcelain .foundry ACTIVE_SESSIONS.md) ]]; then
            git add .foundry ACTIVE_SESSIONS.md
            git commit -m "Foundry: Promote unblocked nodes to READY and update ACTIVE_SESSIONS.md" 2>&1 | tee -a commit-promotions.log
            git pull --rebase origin main 2>&1 | tee -a commit-promotions.log || {
              echo "Rebase conflict detected during promotions. Retrying orchestrator on updated origin/main..."
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              node --strip-types .github/scripts/foundry-orchestrator.ts --strict
              git add .foundry ACTIVE_SESSIONS.md
              if [[ -n $(git status --porcelain .foundry ACTIVE_SESSIONS.md) ]]; then
                git commit -m "Foundry: Promote unblocked nodes to READY and update ACTIVE_SESSIONS.md"
                git pull --rebase origin main
              fi
            }
            git push origin main 2>&1 | tee -a commit-promotions.log
          else
            echo "No state changes to persist."
          fi

      - name: Report Orchestrate Failure
        if: failure() && env.SKIP_FAILURE_ISSUE != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MY_ISSUES_PAT }}
        run: |
          ISSUE_TITLE="Foundry Engine: Orchestrate Failure - ${{ github.run_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "The Foundry Engine failed during the orchestration phase."
            echo ""
            echo "**Run Details:** [View Action Run]($RUN_URL)"
            echo ""

            if [ -f commit-promotions.log ]; then
              echo "**Commit Promotions Log:**"
              echo ""
              echo '```text'
              cat commit-promotions.log
              echo '```'
              echo ""
            fi

          } > issue_body.md

          gh issue create --title "$ISSUE_TITLE" --body-file issue_body.md --label "jules"

  execute:
    name: Execute Task
    needs: orchestrate
    runs-on: ubuntu-latest
    if: needs.orchestrate.outputs.matrix != '[]' && needs.orchestrate.outputs.matrix != '' && github.ref == 'refs/heads/main'
    strategy:
      max-parallel: 1 # Strictly sequential to prevent git push collisions
      matrix:
        node: ${{ fromJson(needs.orchestrate.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Invoke Jules Agent
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          NODE_REPO_PATH: ${{ matrix.node.repo_path }}
          NODE_OWNER_PERSONA: ${{ matrix.node.owner_persona }}
          NODE_TITLE: ${{ matrix.node.title }}
          GITHUB_REPO: ${{ github.repository }}
          NODE_ID: ${{ matrix.node.id }}
        run: |
          set -o pipefail
          {
            # Check if 15 sessions have already been successfully scheduled in this run
            git fetch origin main || true
            scheduled_count=$(git log origin/main --grep="run: ${{ github.run_id }}" --oneline | wc -l || echo "0")
            echo "Successfully scheduled sessions in this run so far: $scheduled_count"
            if [[ "$scheduled_count" -ge 15 ]]; then
              echo "::notice::Max limit of 15 scheduled sessions reached for run ${{ github.run_id }}. Skipping remaining task $NODE_ID."
              {
                echo "SESSION_SCHEDULED=false"
                echo "SKIP_FAILURE_ISSUE=true"
              } >> "$GITHUB_ENV"
              exit 0
            fi

            # 1. Capture task content for the prompt
            task_content=$(cat "$NODE_REPO_PATH")
            
            # Compile the multi-layered prompt on the fly
            agent_context=$(node --experimental-strip-types .github/scripts/foundry-orchestrator.ts --compile "$NODE_REPO_PATH")

            if [[ -z "$agent_context" ]]; then
              owner_persona="$NODE_OWNER_PERSONA"
              agent_file=".github/agents/${owner_persona}.md"

              if [[ -n "$owner_persona" && -f "$agent_file" ]]; then
                agent_context=$(cat "$agent_file")
              else
                agent_context="As the coder of The Foundry, your task is described in the provided node file. You must automatically index and read relevant knowledge from .foundry/docs/knowledge_base/ whenever assigned a task. Follow the schema rules and implementation guidelines."
              fi
            fi

            # 1.5 Extract research_references from parent chain safely
            research_context_str=$(node --strip-types .github/scripts/extract-research.ts "$NODE_REPO_PATH")

            if [[ -n "$research_context_str" ]]; then
              agent_context="${agent_context}\n\n### RESEARCH REFERENCES\nThe following research context paths have been automatically injected from the node dependency chain. You may use the read_file tool to read their contents if necessary:\n${research_context_str}"
            fi

            # 2. Construct the prompt JSON
            # source: sources/github/<owner>/<repo>
            prompt_json=$(jq -n \
              --arg task "$task_content" \
              --arg agent_context "$agent_context" \
              --arg title "$NODE_TITLE" \
              --arg repo "$GITHUB_REPO" \
              --arg schema_url "https://github.com/$GITHUB_REPO/blob/main/.foundry/docs/schema.md" \
              '{
                "prompt": "\($agent_context)\n\n### CRITICAL RULE\n1. DO NOT modify the YAML frontmatter of the task node. Only update the markdown body (e.g., acceptance criteria checkboxes).\n2. AUTONOMOUS NO-ASK POLICY: Never ask conversational questions, ask for permission to proceed, or ask whether to open/submit a PR or request code review in chat. Execute all decisions autonomously and call submit immediately when work or demotion steps are ready.\n\n### TASK NODE\n\($task)\n\n### SCHEMA\n\($schema_url)",
                "sourceContext": {
                  "source": "sources/github/\($repo)",
                  "githubRepoContext": {
                    "startingBranch": "main"
                  }
                },
                "automationMode": "AUTO_CREATE_PR",
                "title": $title
              }')

            # 3. Request session from Jules API
            echo "Dispatching Jules session for: $NODE_ID"
            response=$(curl -s -X POST "https://jules.googleapis.com/v1alpha/sessions" \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: $JULES_API_KEY" \
              -d "$prompt_json")

            # 4. Extract and verify session ID
            session_id=$(echo "$response" | jq -r '.id')
            
            error_status=$(echo "$response" | jq -r '.error.status // empty')
            if [[ "$error_status" == "FAILED_PRECONDITION" ]]; then
              echo "::warning::Jules session failed due to quota/precondition (FAILED_PRECONDITION). Skipping task $NODE_ID."
              {
                echo "SESSION_SCHEDULED=false"
                echo "SKIP_FAILURE_ISSUE=true"
              } >> "$GITHUB_ENV"
              exit 0
            fi

            if [[ -z "$session_id" || "$session_id" == "null" ]]; then
              echo "::warning::Failed to capture Jules session ID for $NODE_ID. Ignoring failure and moving to next task."
              echo "Response: $response"
              {
                echo "SESSION_SCHEDULED=false"
                echo "SKIP_FAILURE_ISSUE=true"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            
            session_url="https://jules.google.com/session/$session_id"
            {
              echo "SESSION_SCHEDULED=true"
              echo "SESSION_ID=$session_id"
              echo "SESSION_URL=$session_url"
            } >> "$GITHUB_ENV"
            {
              echo "session_id=$session_id"
              echo "session_url=$session_url"
            } >> "$GITHUB_OUTPUT"
            echo "Successfully spawned Jules session: $session_id"
            echo "Jules Session URL: $session_url"
            echo "### 🤖 Jules Session: $session_url" >> "$GITHUB_STEP_SUMMARY"

            echo "Sleeping for 3 minutes (180 seconds) after successful session dispatch..."
            sleep 180
          } 2>&1 | tee invoke-agent.log

      - name: Transition node to ACTIVE
        if: env.SESSION_SCHEDULED == 'true'
        env:
          NODE_REPO_PATH: ${{ matrix.node.repo_path }}
        run: |
          set -o pipefail
          # Transition the file to ACTIVE state and inject the real Jules ID
          node --strip-types .github/scripts/foundry-active.ts "$NODE_REPO_PATH" "$SESSION_ID" 2>&1 | tee active-transition.log

      - name: Commit State Change
        if: env.SESSION_SCHEDULED == 'true'
        env:
          NODE_REPO_PATH: ${{ matrix.node.repo_path }}
          NODE_ID: ${{ matrix.node.id }}
        run: |
          set -o pipefail
          git add "$NODE_REPO_PATH" ACTIVE_SESSIONS.md
          git commit -m "Foundry: Transition $NODE_ID -> ACTIVE [$SESSION_ID] (run: ${{ github.run_id }})" 2>&1 | tee -a commit.log
          git pull --rebase origin main 2>&1 | tee -a commit.log || {
            echo "Rebase conflict detected during ACTIVE transition. Retrying on updated origin/main..."
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            node --strip-types .github/scripts/foundry-active.ts "$NODE_REPO_PATH" "$SESSION_ID"
            git add "$NODE_REPO_PATH" ACTIVE_SESSIONS.md
            git commit -m "Foundry: Transition $NODE_ID -> ACTIVE [$SESSION_ID] (run: ${{ github.run_id }})"
            git pull --rebase origin main
          }
          git push origin main 2>&1 | tee -a commit.log

      - name: Report Execution Failure
        if: failure() && env.SKIP_FAILURE_ISSUE != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MY_ISSUES_PAT }}
          NODE_ID: ${{ matrix.node.id }}
        run: |
          ISSUE_TITLE="Foundry Engine: Execution Failure ($NODE_ID) - ${{ github.run_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "The Foundry Engine failed during the execution phase for \`$NODE_ID\`."
            echo ""
            if [[ -n "$SESSION_ID" && "$SESSION_ID" != "null" ]]; then
              echo "**Jules Session URL:** [https://jules.google.com/session/$SESSION_ID](https://jules.google.com/session/$SESSION_ID)"
            else
              echo "**Jules Session ID:** \`Not generated or failed to capture\`"
            fi
            echo "**Run Details:** [View Action Run]($RUN_URL)"
            echo ""
            
            if [ -f invoke-agent.log ]; then
              echo "**Invoke Jules Agent Log:**"
              echo ""
              echo '```text'
              cat invoke-agent.log
              echo '```'
              echo ""
            fi

            if [ -f active-transition.log ]; then
              echo "**Transition to ACTIVE Log:**"
              echo ""
              echo '```text'
              cat active-transition.log
              echo '```'
              echo ""
            fi

            if [ -f commit.log ]; then
              echo "**Commit Log:**"
              echo ""
              echo '```text'
              cat commit.log
              echo '```'
              echo ""
            fi
            
          } > issue_body.md

          gh issue create --title "$ISSUE_TITLE" --body-file issue_body.md --label "jules"
