name: Foundry Zombie Garbage Collection

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode without modifying files'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  garbage-collection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        working-directory: .github/scripts
        run: pnpm install

      - name: Run Garbage Collector
        working-directory: .github/scripts
        run: pnpm run gc ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}

      - name: Commit Auto-Remediations
        run: |
          git config --global user.name "Foundry Orchestrator"
          git config --global user.email "orchestrator@szubster.com"
          if [[ $(git status --porcelain) ]]; then
            git add .
            git commit -m "chore(foundry): auto-remediate zombie nodes"
            git push
          else
            echo "No zombie nodes found to auto-remediate."
          fi
