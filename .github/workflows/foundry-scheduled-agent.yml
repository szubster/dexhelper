name: "🤖 Foundry Scheduled Agent"

on:
  workflow_call:
    inputs:
      persona:
        description: "The persona of the agent to run (e.g., 'tpm', 'agile_coach')"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      persona:
        description: "The persona of the agent to run (e.g., 'tpm', 'agile_coach')"
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute_scheduled_agent:
    name: Execute Scheduled Agent
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Invoke Jules Agent
        id: invoke-jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PERSONA: ${{ inputs.persona }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          persona="$PERSONA"
          agent_file=".github/agents/${persona}.md"

          agent_context=$(node --experimental-strip-types .github/scripts/foundry-orchestrator.ts --compile-scheduled "$persona")

          if [[ -z "$agent_context" ]]; then
            if [[ -f "$agent_file" ]]; then
              agent_context=$(cat "$agent_file")
            else
              echo "::error::Agent file $agent_file not found and prompt compilation failed."
              exit 1
            fi
          fi

          # Construct the prompt JSON
          prompt_json=$(jq -n \
            --arg agent_context "$agent_context" \
            --arg empty_state "If you determine there is no actionable work to be done during this run, simply state that in your PR and complete your session. An empty PR diff is acceptable and will be closed automatically." \
            --arg repo "$GITHUB_REPO" \
            --arg schema_url "https://github.com/$GITHUB_REPO/blob/main/.foundry/docs/schema.md" \
            --arg title "Scheduled Agent: $persona" \
            '{
              "prompt": "\($agent_context)\n\n\($empty_state)\n\n### CRITICAL RULE\n1. AUTONOMOUS NO-ASK POLICY: Never ask conversational questions, ask for permission to proceed, or ask whether to open/submit a PR or request code review in chat. Execute all decisions autonomously and call submit immediately when work or demotion steps are ready.\n\n### SCHEMA\n\($schema_url)",
              "sourceContext": {
                "source": "sources/github/\($repo)",
                "githubRepoContext": {
                  "startingBranch": "main"
                }
              },
              "automationMode": "AUTO_CREATE_PR",
              "title": $title
            }')

          # Request session from Jules API with retry loop for quota / API errors
          # Retries every ~15 minutes (+ random jitter) up to 4 hours total (14,400s)
          base_delay=900
          max_duration=14400
          start_time=$(date +%s)
          attempt=1

          echo "Dispatching Jules session for: $persona"

          while true; do
            now=$(date +%s)
            elapsed=$((now - start_time))

            if [[ $attempt -gt 1 ]]; then
              if [[ $elapsed -ge $max_duration ]]; then
                echo "::error::Reached max duration of 4 hours ($elapsed seconds elapsed) without successfully spawning session."
                exit 1
              fi

              # Add random jitter between 0 and 120 seconds to 15 minutes base delay
              jitter=$(( RANDOM % 120 ))
              delay=$(( base_delay + jitter ))

              remaining=$(( max_duration - elapsed ))
              if [[ $delay -gt $remaining ]]; then
                delay=$remaining
              fi

              echo "Attempt $attempt: Retrying in $delay seconds ($elapsed seconds elapsed so far)..."
              sleep "$delay"
            fi

            response=$(curl -s -X POST "https://jules.googleapis.com/v1alpha/sessions" \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: $JULES_API_KEY" \
              -d "$prompt_json")

            session_id=$(echo "$response" | jq -r '.id // empty')

            if [[ -n "$session_id" && "$session_id" != "null" ]]; then
              session_url="https://jules.google.com/session/$session_id"
              echo "Successfully spawned Jules session: $session_id"
              echo "Jules Session URL: $session_url"
              echo "SESSION_ID=$session_id" >> "$GITHUB_ENV"
              echo "SESSION_URL=$session_url" >> "$GITHUB_ENV"
              echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
              echo "session_url=$session_url" >> "$GITHUB_OUTPUT"
              echo "### 🤖 Jules Session: $session_url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            error_msg=$(echo "$response" | jq -r '.error.message // .error.status // "Unknown error"')
            echo "::warning::Attempt $attempt failed: $error_msg"
            echo "Full API response: $response"

            attempt=$((attempt + 1))
          done
