name: "🤖 Foundry Scheduled Agent"

on:
  workflow_call:
    inputs:
      persona:
        description: "The persona of the agent to run (e.g., 'tpm', 'agile_coach')"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      persona:
        description: "The persona of the agent to run (e.g., 'tpm', 'agile_coach')"
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute_scheduled_agent:
    name: Execute Scheduled Agent
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dispatch Issue
        id: dispatch-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONA: ${{ inputs.persona }}
        run: |
          persona="$PERSONA"
          agent_file=".github/agents/${persona}.md"

          agent_context=$(node --experimental-strip-types .github/scripts/foundry-orchestrator.ts --compile-scheduled "$persona")

          if [[ -z "$agent_context" ]]; then
            if [[ -f "$agent_file" ]]; then
              agent_context=$(cat "$agent_file")
            else
              echo "::error::Agent file $agent_file not found and prompt compilation failed."
              exit 1
            fi
          fi

          echo "Dispatching GitHub issue for scheduled run of: $persona"

          temp_file=$(mktemp)

          echo "$agent_context" > "$temp_file"
          echo "" >> "$temp_file"
          echo "If you determine there is no actionable work to be done during this run, simply state that in your PR and complete your session. An empty PR diff is acceptable and will be closed automatically." >> "$temp_file"
          echo "" >> "$temp_file"
          echo "### CRITICAL RULE" >> "$temp_file"
          echo "1. AUTONOMOUS NO-ASK POLICY: Never ask conversational questions, ask for permission to proceed, or ask whether to open/submit a PR or request code review in chat. Execute all decisions autonomously and call submit immediately when work or demotion steps are ready." >> "$temp_file"
          echo "" >> "$temp_file"
          echo "### SCHEMA" >> "$temp_file"
          echo "https://github.com/${{ github.repository }}/blob/main/.foundry/docs/schema.md" >> "$temp_file"

          issue_url=$(gh issue create --title "Scheduled Agent: $persona" --body-file "$temp_file")
          echo "Successfully created issue: $issue_url"
          echo "### 🤖 Scheduled Issue: $issue_url" >> "$GITHUB_STEP_SUMMARY"
