name: Clean Jules Sessions

on:
  schedule:
    - cron: '30 3 * * *' # Daily at 03:30 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cleanup mode'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'stuck-only'
      limit:
        description: 'Maximum number of sessions to delete'
        required: false
        default: '500'
      dry_run:
        description: 'Dry run mode (simulate without deleting)'
        required: false
        default: false
        type: boolean

concurrency:
  group: clean-jules-sessions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clean-sessions:
    name: Prune Jules Sessions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Clean Jules Sessions
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'all' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '500' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -o pipefail

          FLAGS=("--limit" "$INPUT_LIMIT")
          if [[ "$INPUT_MODE" == "all" ]]; then
            FLAGS+=("--all")
          else
            FLAGS+=("--stuck-only")
          fi

          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            FLAGS+=("--dry-run")
          fi

          echo "Running session cleanup with flags: ${FLAGS[*]}"
          node --strip-types packages/foundry/clean-jules-sessions.ts "${FLAGS[@]}"
