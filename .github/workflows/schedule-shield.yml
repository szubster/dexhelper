name: "🕰️ Schedule: Shield"
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  run_shield:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Create GitHub Issue for Jules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMPILED_PROMPT=$(node --experimental-strip-types .github/scripts/foundry-orchestrator.ts --compile-scheduled "shield")

          gh issue create --title "Scheduled Agent: shield" --body "$COMPILED_PROMPT" --label "jules"
