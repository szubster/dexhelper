packages:
  - "."
  - "apps/*"
  - "packages/*"
  - "tools/*"
  - "packages/foundry"

minimumReleaseAgeExclude:
  - "@oxlint-tsgolint/*"
  - "oxlint-tsgolint"
  - "serialize-javascript"

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  msgpackr-extract: true
  workerd: true
  '@google/genai': true
  protobufjs: true

auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5

overrides:
  fast-uri: ^3.1.9
  brace-expansion: ^2.1.7
  undici: ^7.30.1
  serialize-javascript: ^7.1.3
  seroval: ^1.6.3
  postcss-selector-parser: ^7.1.6
  sharp: ^0.35.5
  follow-redirects: ^1.16.1
  zod: ^4.6.6
