# Lefthook configuration
# Refer to https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    validate-foundry-schema:
      run: git diff --name-only --cached --diff-filter=d -- {staged_files} | xargs -r node --experimental-strip-types scripts/validate-foundry-schema.ts
    link-checker:
      run: node --experimental-strip-types scripts/check-links.ts {staged_files}
    biome-check:
      run: pnpm exec biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      fail_on_changes: ci
    oxlint:
      run: pnpm exec oxlint --type-aware --no-error-on-unmatched-pattern {staged_files}
    knip:
      run: pnpm knip --no-exit-code
    type-check:
      run: pnpm type-check
    sort-package-json:
      run: pnpm exec sort-package-json {staged_files}
      glob: "package.json"
      stage_fixed: true
